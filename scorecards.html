<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Football Scorecard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 style="text-align:center;">Football Scorecard</h2>
    <table>
      <tr>
        <th>Team</th>
        <th>1st Quarter</th>
        <th>2nd Quarter</th>
        <th>3rd Quarter</th>
        <th>4th Quarter</th>
      </tr>
      <tr>
        <td>9</td>
        <td>12</td>
        <td>18</td>
        <td>25</td>
      </tr>
      <tr>
        <td>Philadelphia Eagles</td>
        <td>3</td>
        <td>12</td>
        <td>22</td>
        <td>29</td>
      </tr>
    </table>
  </body>
</html>
