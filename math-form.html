<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Test</title>
  </head>
  <body>
    <h1>Math Test</h1>

    <!-- Start of the Test -->
    <form>
      <h2>Full Name: <input type="text"></h2>
      <p>
        1. 4 &times; 5 =<br>
        <input type="radio" name="Q1" value="80">80<br>
        <input type="radio" name="Q1" value="60">60<br>
        <input type="radio" name="Q1" value="40">40<br>
        <input type="radio" name="Q1" value="20">20
      </p>
      <p>
        2. 100 &divide; 4 =<br>
        <input type="radio" name="Q2" value="20">20<br>
        <input type="radio" name="Q2" value="25">25<br>
        <input type="radio" name="Q2" value="30">30<br>
        <input type="radio" name="Q2" value="50">50
      </p>
      <p>
        3. 15 &minus; 7 =<br>
        <input type="radio" name="Q3" value="6">6<br>
        <input type="radio" name="Q3" value="7">7<br>
        <input type="radio" name="Q3" value="8">8<br>
        <input type="radio" name="Q3" value="9">9
      </p>
      <p>
        <strong>Word Problem:</strong><br>
        If John has 5 apples and gives 2 away, how many does he have left? 
        Show your work below.<br>
        <textarea name="wordProblem" rows="4" cols="40"></textarea>
      </p>

      <input type="submit" value="Submit Test">

    </form>
    <!-- End of the Test -->
    
  </body>
</html>
