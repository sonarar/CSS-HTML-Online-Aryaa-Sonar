<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basketball Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2 style="text-align:center;">Basketball Scorecard</h2>
    <table>
        <tr>
            <th>Team</th>
            <th>1st Quarter</th>
            <th>2nd Quarter</th>
            <th>3rd Quarter</th>
            <th>4th Quarter</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>Los Angeles Lakers</td>
            <td>28</td>
            <td>31</td>
            <td>24</td>
            <td>32</td>
            <td><strong>115</strong></td>
        </tr>
        <tr>
            <td>Boston Celtics</td>
            <td>30</td>
            <td>27</td>
            <td>29</td>
            <td>26</td>
            <td><strong>112</strong></td>
        </tr>
    </table>
</body>
</html>
